# TEMPORAL — importa la narración IA ya generada en ElevenLabs (aprobada por JF Solutions el 9-nov-2026).
# Solo corre en la rama de desarrollo de la experiencia. Descarga las tomas, arma la pista de 90 s por idioma
# (dev/experiencia/audio/build-audio.mjs), regenera páginas y subtítulos, y guarda el resultado en la MISMA rama.
# No toca main ni producción. Se elimina después de la importación.
name: Importar narración (temporal)
on:
  push:
    branches: [feature/jf-cinematic-experience-v1]
    paths: ['dev/experiencia/audio/import-urls.txt']
permissions:
  contents: write
concurrency: { group: importar-narracion, cancel-in-progress: false }
jobs:
  importar:
    if: github.ref == 'refs/heads/feature/jf-cinematic-experience-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Descargar las 20 tomas
        run: |
          mkdir -p "$RUNNER_TEMP/tomas"
          grep -v '^#' dev/experiencia/audio/import-urls.txt | while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/tomas/$name.mp3" "$url"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/tomas/$name.mp3" | sed "s/^/$name /"
          done
          test "$(ls "$RUNNER_TEMP/tomas" | wc -l)" -eq 20
      - name: Armar narración, subtítulos y páginas
        run: |
          node dev/experiencia/audio/build-audio.mjs --src "$RUNNER_TEMP/tomas"
          node dev/experiencia/build.mjs
          node dev/experiencia/tests/static.mjs
      - name: Guardar en la rama de desarrollo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/experiencia dev/experiencia/audio/timing.json experiencia en/experience
          git commit -m "Narración IA importada: pistas de 90 s EN/ES (Opus + MP3) y subtítulos alineados a la voz" -m "Generado por el flujo temporal importar-narracion a partir de las tomas de ElevenLabs listadas en takes.json."
          git pull --rebase origin feature/jf-cinematic-experience-v1
          git push origin HEAD:feature/jf-cinematic-experience-v1
